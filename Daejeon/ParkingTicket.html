<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B:FRAME 주차이용권</title>

  <!-- PNG 저장용 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --brand:#4F7373;
      --orange:#F39A3B;
      --brown:#5E5048;
      --line:#4F7373;
      --panel1:#F3F7F5;
      --panel2:#F7F4EE;
      --bg:#FBFAF7;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#ececec;
      font-family:
        "Noto Serif KR",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
      color:#263b3b;
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* 실제 저장되는 주차권 */
    #ticket{
      width:900px;
      height:1600px;
      background:#FFFFFF;
      position:relative;
      overflow:hidden;
      padding:105px 70px 72px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* PNG 저장 시 테두리가 잘리지 않도록 흰 여백 안쪽에 테두리를 배치 */
    #ticket::before{
      content:"";
      position:absolute;
      inset:18px;
      border:3px solid var(--line);
      border-radius:32px;
      pointer-events:none;
      z-index:5;
    }

    /* 내용은 내부 테두리 위에 안정적으로 표시 */
    #ticket > *{
      position:relative;
      z-index:1;
    }

    .camera-logo{
      width:180px;
      height:86px;
      margin-bottom:20px;
    }

    .brand-top{
      font-family:Arial, Helvetica, sans-serif;
      font-size:54px;
      font-weight:700;
      letter-spacing:-2px;
      color:var(--brand);
      line-height:1;
    }

    .branch{
      margin-top:56px;
      font-size:31px;
      color:var(--brown);
      letter-spacing:2px;
      font-family:"Noto Serif KR","Batang",serif;
      font-weight:400;
    }

    .accent{
      width:62px;
      height:3px;
      background:var(--orange);
      margin-top:30px;
      border-radius:999px;
    }

    .title-wrap{
      margin-top:110px;
      text-align:center;
    }

    .ticket-title{
      font-family:"Noto Serif KR","Batang",serif;
      font-weight:400;
      font-size:74px;
      letter-spacing:7px;
      color:#295f63;
      line-height:1.1;
      margin:0;
    }

    .ticket-sub{
      margin-top:28px;
      font-family:Arial, Helvetica, sans-serif;
      font-size:25px;
      letter-spacing:15px;
      color:#665b55;
    }

    .panel{
      width:100%;
      border-radius:26px;
    }

    .date-panel{
      margin-top:108px;
      min-height:210px;
      background:var(--panel1);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .panel-label{
      font-family:"Noto Serif KR","Batang",serif;
      font-size:29px;
      color:#5f5149;
      letter-spacing:2px;
      margin-bottom:18px;
    }

    .datetime{
      font-family:"Times New Roman","Noto Serif KR",serif;
      font-size:55px;
      color:#2e6b70;
      letter-spacing:2px;
      white-space:nowrap;
    }

    .info-panel{
      margin-top:26px;
      min-height:240px;
      background:var(--panel2);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:#4d443f;
      font-family:"Noto Serif KR","Batang",serif;
      font-size:30px;
      line-height:1.95;
      letter-spacing:1px;
      text-align:center;
    }

    .brand-bottom{
      margin-top:auto;
      display:flex;
      align-items:center;
      gap:12px;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--brand);
      font-size:34px;
      letter-spacing:-1px;
    }

    .brand-bottom strong{
      font-weight:700;
    }

    .brand-bottom .studio{
      font-weight:400;
    }

    .focus-mark{
      width:37px;
      height:37px;
    }

    .controls{
      width:900px;
      margin:16px auto 0;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      border:0;
      padding:12px 20px;
      border-radius:10px;
      background:var(--brand);
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .hint{
      width:900px;
      margin:10px auto 30px;
      text-align:center;
      color:#666;
      font-size:14px;
    }

    @media (max-width: 960px){
      .page{
        padding:0;
        display:block;
      }

      #ticket{
        width:100vw;
        height:177.78vw;
        min-height:100vh;
        padding:8.5vw 7.5vw 6.5vw;
      }

      #ticket::before{
        inset:2vw;
        border-width:2px;
        border-radius:3.5vw;
      }

      .camera-logo{width:20vw;height:auto;margin-bottom:2vw}
      .brand-top{font-size:6vw}
      .branch{margin-top:6vw;font-size:3.5vw}
      .accent{width:7vw;margin-top:3vw}
      .title-wrap{margin-top:11vw}
      .ticket-title{font-size:8vw}
      .ticket-sub{font-size:2.7vw;letter-spacing:1.4vw;margin-top:3vw}
      .date-panel{margin-top:11vw;min-height:22vw}
      .panel-label{font-size:3.2vw;margin-bottom:2vw}
      .datetime{font-size:5.6vw}
      .info-panel{margin-top:2.8vw;min-height:25vw;font-size:3.2vw}
      .brand-bottom{font-size:3.7vw}
      .focus-mark{width:4vw;height:4vw}
      .controls,.hint{width:100%}
    }
  </style>
</head>

<body>
  <div class="page">
    <div id="ticket">

      <!-- 상단 카메라 로고 -->
      <svg class="camera-logo" viewBox="0 0 220 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 74V45C14 35.6 21.6 28 31 28H83L91 10H126L136 28H154L163 18H183L192 28H200C209.4 28 217 35.6 217 45V74"
              stroke="#4F7373" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M79 75C83 52 96 41 111 41C126 41 139 52 143 75"
              stroke="#4F7373" stroke-width="7" stroke-linecap="round"/>
      </svg>

      <div class="brand-top">B:FRAME</div>

      <div class="branch">대전시청점</div>
      <div class="accent"></div>

      <div class="title-wrap">
        <h1 class="ticket-title">주차 이용권</h1>
        <div class="ticket-sub">PARKING TICKET</div>
      </div>

      <div class="panel date-panel">
        <div class="panel-label">발급일시</div>
        <div class="datetime" id="datetime">2026.09.30 15:30</div>
      </div>

      <div class="panel info-panel">
        <div>비프레임스튜디오 이용 고객 전용</div>
        <div>당일 1회 제시용</div>
        <div>경비실 확인용</div>
      </div>

      <div class="brand-bottom">
        <strong>B:FRAME</strong>
        <span class="studio">STUDIO</span>
        <svg class="focus-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M3 13V3H13M27 3H37V13M37 27V37H27M13 37H3V27"
                stroke="#4F7373" stroke-width="4" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="3.5" fill="#4F7373"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="downloadBtn">주차권 PNG 저장</button>
  </div>

  <script>
    // 한국 시간 기준 현재 일시 표시
    function getKoreaNow(){
      const now = new Date();

      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }).formatToParts(now);

      const obj = {};
      parts.forEach(p => obj[p.type] = p.value);

      return {
        display: `${obj.year}.${obj.month}.${obj.day} ${obj.hour}:${obj.minute}`,
        file: `${obj.year}${obj.month}${obj.day}_${obj.hour}${obj.minute}`
      };
    }

    const issue = getKoreaNow();
    document.getElementById('datetime').textContent = issue.display;

    async function downloadTicket(){
      const ticket = document.getElementById('ticket');

      const canvas = await html2canvas(ticket, {
        scale: 2,
        backgroundColor: '#FFFFFF',
        useCORS: true,
        logging: false
      });

      const link = document.createElement('a');
      link.download = `BFRAME_PARKING_${issue.file}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    document.getElementById('downloadBtn').addEventListener('click', downloadTicket);

    // QR 접속 시 자동 다운로드
    // 모바일 브라우저 정책상 자동 다운로드가 막힐 수 있으므로,
    // 실패 시 아래 버튼으로 직접 저장 가능
    window.addEventListener('load', () => {
      setTimeout(() => {
        downloadTicket().catch(() => {});
      }, 700);
    });
  </script>
</body>
</html>
