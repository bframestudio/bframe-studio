<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B:FRAME 주차이용권</title>

  <!-- iPhone/PC에서 같은 한글 글꼴을 쓰도록 웹폰트 고정 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">

  <!-- PNG 저장용 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --brand:#4F7373;
      --orange:#F39A3B;
      --brown:#5E5048;
      --line:#4F7373;
      --panel1:#F3F7F5;
      --panel2:#F7F4EE;
      --bg:#FBFAF7;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#ececec;
      font-family:
        "Noto Serif KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        serif;
      color:#263b3b;
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* 실제 저장되는 주차권 */
    #ticket{
      width:900px;
      height:1450px;
      background:#FFFFFF;
      position:relative;
      overflow:hidden;
      padding:105px 70px 72px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* PNG 저장 시 테두리가 잘리지 않도록 흰 여백 안쪽에 테두리를 배치 */
    #ticket::before{
      content:"";
      position:absolute;
      inset:18px;
      border:3px solid var(--line);
      border-radius:32px;
      pointer-events:none;
      z-index:5;
    }

    /* 내용은 내부 테두리 위에 안정적으로 표시 */
    #ticket > *{
      position:relative;
      z-index:1;
    }

    .top-logo{
      width:315px;
      max-width:76%;
      margin-bottom:0;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .top-logo svg{
      width:100%;
      height:auto;
      display:block;
    }

    .branch{
      margin-top:74px;
      margin-bottom:10px;
      font-size:31px;
      color:var(--brown);
      letter-spacing:2px;
      font-family:"Noto Serif KR","Batang",serif;
      font-weight:400;
    }

    .accent{
      width:59px;
      height:3px;
      background:var(--orange);
      margin-top:0;
      border-radius:999px;
    }

    .title-wrap{
      margin-top:74px;
      text-align:center;
    }

    .ticket-title{
      font-family:"Noto Serif KR","Batang",serif;
      font-weight:400;
      font-size:74px;
      letter-spacing:7px;
      color:#295f63;
      line-height:1.1;
      margin:0;
    }

    .ticket-sub{
      margin-top:28px;
      font-family:Arial, Helvetica, sans-serif;
      font-size:25px;
      letter-spacing:15px;
      color:#665b55;
    }

    .panel{
      width:100%;
      border-radius:26px;
    }

    .date-panel{
      margin-top:108px;
      min-height:210px;
      background:var(--panel1);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .panel-label{
      font-family:"Noto Serif KR","Batang",serif;
      font-size:29px;
      color:#5f5149;
      letter-spacing:2px;
      margin-bottom:18px;
    }

    .datetime{
      font-family:"Times New Roman","Noto Serif KR",serif;
      font-size:55px;
      color:#2e6b70;
      letter-spacing:2px;
      white-space:nowrap;
    }

    .info-panel{
      margin-top:26px;
      min-height:240px;
      background:var(--panel2);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:#4d443f;
      font-family:"Noto Serif KR","Batang",serif;
      font-size:30px;
      line-height:1.95;
      letter-spacing:1px;
      text-align:center;
    }

    .info-small{
      font-size:22px;
      line-height:1.7;
      opacity:.9;
    }

    .bottom-logo{
      margin-top:auto;
      width:355px;
      max-width:76%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .bottom-logo svg{
      width:100%;
      height:auto;
      display:block;
    }

    .controls{
      width:900px;
      margin:16px auto 0;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      border:0;
      padding:14px 24px;
      border-radius:12px;
      background:var(--brand);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    }

    button:disabled{
      opacity:.55;
      cursor:default;
    }


    @media (max-width: 960px){
      .page{
        padding:0;
        display:block;
      }

      .page{
        padding:12px 0 0;
      }

      #ticket{
        width:390px;
        height:628px;
        max-width:calc(100vw - 24px);
        max-height:none;
        min-height:0;
        padding:33px 29px 25px;
      }

      #ticket::before{
        inset:8px;
        border-width:2px;
        border-radius:14px;
      }

      .top-logo{width:137px;max-width:72%;margin-bottom:0}
      .branch{margin-top:31px;margin-bottom:4px;font-size:14px}
      .accent{width:26px;height:2px;margin-top:0}
      .title-wrap{margin-top:31px}
      .ticket-title{font-size:31px;letter-spacing:3px}
      .ticket-sub{font-size:10px;letter-spacing:5px;margin-top:12px}
      .date-panel{margin-top:43px;min-height:86px;border-radius:11px}
      .panel-label{font-size:12px;margin-bottom:8px}
      .datetime{font-size:22px}
      .info-panel{margin-top:11px;min-height:98px;font-size:12px;border-radius:11px;line-height:1.85}
      .info-small{font-size:9px}
      .bottom-logo{width:152px;max-width:74%}
      .controls{width:100%}
    }
  </style>
</head>

  <div class="controls">
    <button id="downloadBtn" disabled>주차권 이미지 준비 중…</button>
  </div>

  <script>
    function getKoreaNow(){
      const now = new Date();

      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }).formatToParts(now);

      const obj = {};
      parts.forEach(p => obj[p.type] = p.value);

      return {
        display: `${obj.year}.${obj.month}.${obj.day} ${obj.hour}:${obj.minute}`,
        file: `${obj.year}${obj.month}${obj.day}_${obj.hour}${obj.minute}`
      };
    }

    const issue = getKoreaNow();
    const datetimeEl = document.getElementById('datetime');
    const saveBtn = document.getElementById('downloadBtn');

    datetimeEl.textContent = issue.display;

    let pngBlob = null;
    let pngFile = null;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function canvasToBlob(canvas){
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('PNG 변환 실패'));
        }, 'image/png', 1);
      });
    }

    async function buildTicketImage(){
      // 웹폰트가 실제로 모두 로드된 뒤 캡처해야 iPhone/PC 글꼴이 동일해집니다.
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const ticket = document.getElementById('ticket');

      const canvas = await html2canvas(ticket, {
        scale: 2,
        backgroundColor: '#FFFFFF',
        useCORS: true,
        allowTaint: false,
        logging: false
      });

      pngBlob = await canvasToBlob(canvas);
      pngFile = new File(
        [pngBlob],
        `BFRAME_PARKING_${issue.file}.png`,
        { type: 'image/png' }
      );

      saveBtn.disabled = false;
      saveBtn.textContent = isIOS ? '주차권 이미지 저장' : '주차권 PNG 저장';

    }

    async function saveTicket(){
      try {
        if (!pngBlob || !pngFile) {
          await buildTicketImage();
        }

        // iPhone/iPad: 자동 다운로드 대신 iOS 공유 메뉴를 사용합니다.
        // 사용자가 '이미지 저장'을 선택하면 사진 앱에 확실히 저장됩니다.
        if (
          isIOS &&
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [pngFile] })
        ) {
          await navigator.share({
            files: [pngFile],
            title: 'B:FRAME 주차이용권'
          });
          return;
        }

        // 데스크톱/안드로이드 등: 일반 파일 다운로드
        const url = URL.createObjectURL(pngBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = pngFile.name;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 3000);
      } catch (err) {
        // 공유 메뉴를 닫은 경우에는 오류 알림을 띄우지 않음
        if (err && err.name === 'AbortError') return;

        // 마지막 수단: 이미지 자체를 새 창에서 열어 길게 눌러 저장 가능
        if (pngBlob) {
          const url = URL.createObjectURL(pngBlob);
          window.open(url, '_blank');
        }
      }
    }

    saveBtn.addEventListener('click', saveTicket);

    // iOS는 페이지 진입 즉시 발생하는 자동 다운로드를 차단할 수 있으므로
    // 자동 저장은 하지 않고 PNG만 미리 만들어 둡니다.
    window.addEventListener('load', () => {
      buildTicketImage().catch(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = '주차권 이미지 저장';
      });
    });
  </script>
